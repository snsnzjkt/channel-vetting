name: Channel Vetting Pipeline

on:
  schedule:
    # 09:00 UTC = 1-2am Pacific, safely after the YouTube quota resets at
    # midnight Pacific Time. Adjust cadence here (e.g. to a weekly
    # "0 9 * * 1" for Mondays) if daily discovery is more than you need.
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      test_mode:
        description: "Run in --test mode (1 keyword, 5 results)"
        type: boolean
        default: false
      use_playwright_stealth:
        description: "Enable About-page email lookups in Playwright (unproven on runner IPs)"
        type: boolean
        default: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    # Identical for both run steps below, so it lives here rather than
    # being repeated (and kept in sync) twice.
    env:
      AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
      AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
      AIRTABLE_TABLE_HOME_THEATER: ${{ secrets.AIRTABLE_TABLE_HOME_THEATER }}
      AIRTABLE_TABLE_LIFESTYLE_SOFA: ${{ secrets.AIRTABLE_TABLE_LIFESTYLE_SOFA }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      # Off for scheduled runs. Stealth patches browser fingerprints, not
      # datacenter IP reputation, and GitHub runners sit in Azure ranges
      # YouTube challenges hard. Enable via workflow_dispatch to test;
      # only make it the default once a manual run proves it works.
      USE_PLAYWRIGHT_STEALTH: ${{ github.event.inputs.use_playwright_stealth == 'true' }}
      # Pinned so the runner (UTC) agrees with head office on the day.
      PROSPECT_DAY_TZ: America/Toronto

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Persists quota_log.json / search_cache.json / external_handles_cache.json
      # across runs so a same-day manual re-run (workflow_dispatch) doesn't
      # lose track of quota already spent or re-search a keyword already
      # cached today. Not load-bearing for a once-daily schedule for the
      # first two — quota_tracker.py's own Pacific-Time day-keying is what
      # actually enforces the reset. external_handles_cache.json IS
      # load-bearing for run time even on a once-daily schedule: without it
      # every scheduled run re-paginates ~18k Airtable rows across the 4
      # external tables (external_dedupe.py) before any discovery starts.
      - name: Restore quota + search + external-handles cache
        uses: actions/cache@v4
        with:
          path: |
            quota_log.json
            search_cache.json
            external_handles_cache.json
          key: channel-vetting-state-${{ github.run_id }}
          restore-keys: |
            channel-vetting-state-

      # pip installs the playwright package but not the browser binary it
      # drives, so this is what makes browser_email.py functional at all.
      # --with-deps pulls the shared libraries a headless Chromium links
      # against on a bare ubuntu-latest runner. Only on manual dispatch:
      # a scheduled run leaves the browser step off and doesn't need it.
      - name: Install Chromium for Playwright
        if: github.event.inputs.use_playwright_stealth == 'true'
        run: python -m playwright install --with-deps chromium

      - name: Run pipeline (full)
        if: github.event_name == 'schedule' || github.event.inputs.test_mode != 'true'
        run: python main.py

      - name: Run pipeline (test mode)
        if: github.event.inputs.test_mode == 'true'
        run: python main.py --test
