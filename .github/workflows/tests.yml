name: Tests

on:
  pull_request:
  # Also on pushes to main, so a merge that somehow bypassed a PR (a direct
  # push, an admin merge, a squash that behaved unexpectedly) still gets the
  # suite run against the state that actually landed.
  push:
    branches: [main]

# Cancel a superseded run. This is the OPPOSITE of channel-vetting.yml and
# outreach.yml, which both set cancel-in-progress: false — and the difference is
# the point rather than an inconsistency.
#
# Those two spend YouTube quota, influencers.club credits, and send email;
# killing one mid-flight strands a quota ledger or a claim row, so queueing is
# strictly better than cancelling. This workflow only runs pytest against
# mocked HTTP. It spends nothing, writes nothing, and the answer for an
# outdated commit is worthless the moment a newer one exists — so cancelling is
# free and cancelling is correct.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

# The job checks out public code and runs pytest. It never pushes a commit,
# comments on a PR, or reads another repo. Spelled out rather than inherited
# because the default GITHUB_TOKEN scope is still `contents: write` on plenty of
# older repos.
permissions: {}

jobs:
  pytest:
    runs-on: ubuntu-latest

    # The suite runs in ~5 seconds. A minute is already 12x headroom; the real
    # job of this number is to kill a hung collection rather than hold a runner
    # for GitHub's 6-hour default.
    timeout-minutes: 10

    strategy:
      # One version failing must not hide the other's result.
      fail-fast: false
      matrix:
        # 3.12 is what channel-vetting.yml and outreach.yml run in production.
        # 3.13 is what the machine this was developed on runs. That divergence
        # is real and it is exactly how a passing local suite becomes a red
        # production run, so both are tested rather than assumed equivalent.
        python-version: ["3.12", "3.13"]

    steps:
      # Pinned to full commit SHAs, matching the other two workflows. A tag is a
      # mutable ref: whoever controls the action's repo can retag it and every
      # run silently picks up new code. This job holds no secrets, so the stakes
      # are lower than in channel-vetting.yml — but consistency across the three
      # workflows means one bump procedure, not two.
      - name: Check out repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      # --require-hashes refuses any artifact whose sha256 is not listed in
      # requirements.txt. Worth keeping even here: a hijacked package would
      # otherwise execute arbitrary code in a job that reads this repo's source.
      # See requirements.txt's header for how to regenerate the file.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.txt

      # NO SECRETS ARE PASSED TO THIS JOB, and that is a safety control rather
      # than an oversight.
      #
      # tests/conftest.py blocks real HTTP with an autouse fixture patched at
      # HTTPAdapter.send, but its own docstring explains the residual risk: the
      # mocks patch a SPECIFIC attribute (<module>.HTTP), so a call site missed
      # during a refactor falls through to the real network — and "with a
      # populated .env, that means spending real YouTube quota and, worse,
      # writing real rows to the production Airtable base from a test run."
      #
      # A CI job with no credentials cannot do either even if a mock is missed.
      # The guard is the first line; an empty environment is the second.
      #
      # This also means the suite must pass with no configuration at all, which
      # it does — verified by running it with .env removed. If a test ever needs
      # a table name or a flag, pin it with monkeypatch in the test rather than
      # adding an env var here; four tests in test_audit_blocklist.py and two in
      # test_outreach_cli.py failed on a clean checkout for exactly that reason.
      - name: Run tests
        env:
          # tzdata is a hard requirement on Windows and absent from the system
          # tzdb there, but ubuntu-latest ships one. Pinned anyway so the
          # prospect-day and quota zones resolve identically to a dev machine.
          PROSPECT_DAY_TZ: America/Toronto
        run: python -m pytest -q

      # Belt and braces: prove the suite does not depend on ambient config by
      # running it again with the two zone variables cleared. Cheap (~5s) and it
      # catches the class of bug found while adding this workflow, where tests
      # passed only on a machine with a populated .env.
      - name: Run tests with no configuration at all
        run: python -m pytest -q
