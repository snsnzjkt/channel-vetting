name: Outreach

# DISPATCH-ONLY, as of 2026-08-18. The cron is parked — see "WHY THE CRON IS
# PARKED" below before restoring it.
#
# WHAT MAKES THIS SAFE TODAY IS NOT THE SCHEDULE, IT IS THAT SENDING IS
# BLOCKED. OUTREACH_DEMO_MODE defaults true (so every message is redirected)
# and GMAIL_CREDENTIALS_B64 is unset (so --send refuses to start at all). The
# moment BOTH change, a restored cron starts emailing real creators with nobody
# dispatching anything. That is the intent, and it is worth saying out loud:
# setting the credential is the act that arms a scheduled sender, not a
# configuration detail.
#
# WHY THE CRON IS PARKED. It ran once (2026-08-17 19:33Z) and failed, and it
# would have failed every half hour thereafter, because NONE of the outreach
# secrets exist in this repo — OUTREACH_FOOTER_TEXT, OUTREACH_UNSUBSCRIBE_URL,
# OUTREACH_DEMO_RECIPIENT, GMAIL_SENDER_EMAIL and GMAIL_CREDENTIALS_B64 are all
# empty in CI and live only in a local `.env`. The three abort messages were
# exactly the ones the guards exist to produce, so this is the design working:
# it refused to send rather than emailing a real prospect with no footer and no
# opt-out.
#
# But a workflow that fails 16 times a day teaches people to ignore red CI, and
# red CI is where the NEXT real failure will be reported. Meanwhile the sending
# path in use is a pair of Airtable automations (HT · SEND / LS · SEND) driving
# James's connected Google account, precisely so nobody has to hand over a
# refresh token — so there is currently no Python sender to schedule.
#
# TO RESTORE: add the five secrets above, run once via workflow_dispatch with
# mode=dry-run, read the uploaded previews, then re-add
#   schedule:
#     - cron: "*/30 13-21 * * 1-5"
# and read the WEEKDAYS AND BUSINESS HOURS note below, which still applies.
# Do not restore it merely to "turn outreach back on" — that cron plus a
# credential is an armed sender.
#
# The guards that remain once it IS armed, and none of them are the schedule:
#   - only Qualification = Qualified AND Status = Approved AND a human-stamped
#     `Send Requested At` is eligible, so a cron with an empty queue sends
#     nothing no matter how often it runs;
#   - OUTREACH_DAILY_CAP is counted from the Outreach Log per PROSPECT DAY, not
#     per run — which is exactly why running 16 times a day is safe. Ten runs
#     and one run see the same ten-send ceiling;
#   - claim-verify-send, the lease, and the `concurrency` group below.
#
# WEEKDAYS AND BUSINESS HOURS, for a different reason than channel-vetting.yml.
# There the point was not ageing leads over a weekend. Here it is that a send
# is irreversible: run it when somebody is awake to notice a bad batch and stop
# it. `*/30 13-21 * * 1-5` is 09:00-17:00 America/Toronto during EDT and
# 08:00-16:00 during EST — the cron field is UTC and cannot follow DST, so the
# window drifts by an hour twice a year. That is acceptable here (both spans sit
# inside a working day) and is NOT acceptable for channel-vetting.yml, whose
# 09:00 UTC slot has to keep landing on the same calendar day in two zones.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run renders and reports without sending. send actually delivers (and still obeys OUTREACH_DEMO_MODE)."
        type: choice
        options: [dry-run, send]
        default: dry-run
      niche:
        description: "Limit to one niche, e.g. 'Home Theater'. Blank = all niches."
        type: string
        required: false
        default: ""
      limit:
        description: "Max sends this run. Blank = OUTREACH_MAX_PER_RUN. Digits only."
        type: string
        required: false
        default: ""

# Only ever ONE outreach run at a time, repo-wide.
#
# This is the PRIMARY serialisation for outreach, and the Outreach Lock table
# is explicitly the weaker half of the pair. Airtable has no conditional
# writes, so `acquire_lease()` is itself read-then-write and two runs can both
# read the lock as free; claim-verify-send narrows the duplicate window but
# provably does not close it (there is a test named for that limitation). This
# group is the only mechanism here that genuinely prevents two CI runs
# overlapping, so do not remove it on the grounds that the ledger "handles it".
#
# What it does NOT cover: a hand-run `python outreach.py` on a laptop. That is
# the gap the Outreach Lock row exists to make visible.
#
# cancel-in-progress is FALSE for a stronger reason than in channel-vetting:
# cancelling mid-flight would SIGKILL the run between a claim write and its
# settle, stranding a row in `Claimed` — which means "this email MAY have been
# delivered" and requires a human to check a sent-mail folder to resolve.
# Queueing costs wall-clock; cancelling costs someone's afternoon.
concurrency:
  group: outreach
  cancel-in-progress: false

# Same reasoning as channel-vetting.yml: this job needs no repo access at all,
# and it holds AIRTABLE_TOKEN and the mail credential in env for its whole life.
permissions: {}

jobs:
  outreach:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
      AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
      AIRTABLE_TABLE_HOME_THEATER: ${{ secrets.AIRTABLE_TABLE_HOME_THEATER }}
      AIRTABLE_TABLE_LIFESTYLE_SOFA: ${{ secrets.AIRTABLE_TABLE_LIFESTYLE_SOFA }}
      # Pinned so the runner (UTC) agrees with head office about which day a
      # send counts against — the daily cap is denominated in prospect days.
      PROSPECT_DAY_TZ: America/Toronto

      # DEMO MODE. Defaults to "true" here rather than inheriting config.py's
      # default, so the safe value is visible in the workflow file itself and
      # anyone reading this can see what it would take to contact a real
      # creator: someone has to add an OUTREACH_DEMO_MODE secret set to
      # "false". That is a deliberate, auditable act, not a forgotten flag.
      #
      # `secrets.X || 'true'` falls back to the safe value when the secret is
      # absent OR empty, so a half-configured repo stays in demo mode.
      OUTREACH_DEMO_MODE: ${{ secrets.OUTREACH_DEMO_MODE || 'true' }}
      # Where demo mail is redirected. Unset means demo mode refuses to send
      # at all — resolve_recipient() raises rather than falling back to the
      # prospect's real address, which is the bug this exists to prevent.
      OUTREACH_DEMO_RECIPIENT: ${{ secrets.OUTREACH_DEMO_RECIPIENT }}

      # Mail transport. Absent means --send refuses to start (a mailer is NOT
      # a soft-disable optional step, unlike the influencers.club lookup).
      GMAIL_SENDER_EMAIL: ${{ secrets.GMAIL_SENDER_EMAIL }}
      GMAIL_CREDENTIALS_B64: ${{ secrets.GMAIL_CREDENTIALS_B64 }}
      # CAN-SPAM / PECR. No defaults anywhere: --send refuses to start without
      # both, which turns a legal exposure into a startup failure nobody can
      # skip by forgetting.
      OUTREACH_FOOTER_TEXT: ${{ secrets.OUTREACH_FOOTER_TEXT }}
      OUTREACH_UNSUBSCRIBE_URL: ${{ secrets.OUTREACH_UNSUBSCRIBE_URL }}

    steps:
      # Pinned to full commit SHAs for the same reason as channel-vetting.yml:
      # a tag is a mutable ref, and this job has credentials in env.
      - name: Check out repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          # Caches the pip download/wheel dir keyed on requirements.txt. That
          # file is hash-pinned, so a cache hit is a hit on exactly the same
          # artifacts --require-hashes would have verified anyway; a change to
          # requirements.txt changes the key and the cache is bypassed.
          #
          # Worth it because this is the SLOWEST step in an outreach run by an
          # order of magnitude: a cold `pip install --require-hashes` of the
          # full pinned set is ~60-90s, against ~20s for everything else
          # combined. It is the difference between "queued a row, mail is out in
          # under a minute" and "under three".
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.txt

      # Argument injection guard, duplicated from channel-vetting.yml on
      # purpose: routing an input through env: stops SHELL injection, but an
      # unquoted expansion still word-splits, so "10 --send" would smuggle an
      # extra argv entry into a dry run. Validated in its own step so no
      # later `if:` can skip it.
      - name: Validate inputs
        env:
          LIMIT: ${{ inputs.limit }}
          NICHE: ${{ inputs.niche }}
        run: |
          case "$LIMIT" in ""|*[!0-9]*) LIMIT_BAD=1 ;; *) LIMIT_BAD=0 ;; esac
          if [ -n "$LIMIT" ] && [ "$LIMIT_BAD" = "1" ]; then
            echo "limit must be digits only, got: $LIMIT" >&2
            exit 1
          fi
          if [ -n "$NICHE" ] && ! printf '%s' "$NICHE" | grep -Eq '^[A-Za-z ]+$'; then
            echo "niche must be letters and spaces only, got: $NICHE" >&2
            exit 1
          fi

      # Fails fast on a misconfigured base BEFORE anything is claimed: asserts
      # every field name exists, that Send State has exactly the four expected
      # options, that the lock row is present, and that the mail credentials
      # authenticate. Cheaper to fail here than to strand claims mid-run.
      - name: Preflight
        run: python outreach.py --check-setup

      - name: Run outreach
        env:
          # `inputs` is NULL on a schedule event — a workflow_dispatch input's
          # `default:` applies to dispatch only. channel-vetting.yml documents
          # this trap and got it wrong once already, so resolve on event_name
          # rather than on the input.
          #
          # A SCHEDULED run means --send. A dry run on a cron would render
          # previews nobody reads and never clear the queue, which is the
          # opposite of the point. Sending stays blocked by demo mode and the
          # missing credential, not by the mode flag — see the header.
          #
          # The schedule branch is INERT while the cron is parked (event_name
          # can only be workflow_dispatch), and is kept deliberately so that
          # restoring the cron is a one-line change rather than a re-derivation
          # of the null-inputs trap above. Do not "clean it up".
          MODE: ${{ github.event_name == 'schedule' && 'send' || inputs.mode }}
          LIMIT: ${{ inputs.limit }}
          NICHE: ${{ inputs.niche }}
        run: |
          ARGS=""
          if [ "$MODE" = "send" ]; then ARGS="$ARGS --send"; else ARGS="$ARGS --dry-run"; fi
          if [ -n "$LIMIT" ]; then ARGS="$ARGS --limit $LIMIT"; fi
          if [ -n "$NICHE" ]; then ARGS="$ARGS --niche $NICHE"; fi
          python outreach.py $ARGS

      # The rendered .eml files are the only way to see what a dry run WOULD
      # have sent. Uploaded so a human can read them before anyone authorises
      # a real send. if: always() so they survive a non-zero exit — a run that
      # aborted part-way is exactly when you want to see what it produced.
      - name: Upload rendered previews
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: outreach-previews
          path: outreach_preview/
          if-no-files-found: ignore
          retention-days: 7
